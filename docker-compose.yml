services:
  web:
    build:
      context: .
      target: runner
    ports:
      - "${PORT:-3120}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3120}
    restart: unless-stopped

  web-dev:
    profiles:
      - dev
    build:
      context: .
      target: dev
    ports:
      - "${PORT:-3120}:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3120}
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
